name: Validate

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@xuanzhen-tech"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      - name: Run smoke tests
        run: |
          npm run smoke:contract
          npm run smoke:skill
          npm run validate:self-service-skills

      - name: Validate self-service release version
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'skill-release/') }}
        shell: pwsh
        run: |
          $basePackage = git show "${{ github.event.pull_request.base.sha }}:package.json" | ConvertFrom-Json
          $env:AGENT_SKILL_BASE_VERSION = $basePackage.version
          npm run validate:self-service-release

      - name: Verify package
        run: |
          npm run build:artifact
          npm run create:descriptor
          npm run verify
          npm run pack:dry-run
